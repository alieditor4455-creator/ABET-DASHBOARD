      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ae1818"/>
      <stop offset="100%" stop-color="#d42828"/>
    </linearGradient>
