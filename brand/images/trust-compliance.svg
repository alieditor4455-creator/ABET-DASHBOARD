  <rect x="108" y="308" width="120" height="8" rx="2" fill="#ae1818" opacity="0.35"/>
  <rect x="108" y="322" width="200" height="6" rx="2" fill="#bdbdbd"/>
  <rect x="108" y="332" width="160" height="6" rx="2" fill="#d0d0d0"/>
  <circle cx="472" cy="316" r="18" fill="#ae1818" opacity="0.15"/>
  <path d="M464 316l6 6 14-14" fill="none" stroke="#ae1818" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
