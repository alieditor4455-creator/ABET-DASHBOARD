<title>ABET Content OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Mulish:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: fixed, collapsible left sidebar + sticky top bar + scrolling workspace. Brand: ABET red on cool ink neutrals. */
:root{
  --bg:#F6F6F8; --surface:#FFFFFF; --surface-2:#F1F2F4; --surface-3:#E9EAEE;
  --border:#E3E4E9; --border-strong:#CFD1D8;
  --text:#191B22; --text-2:#454955; --muted:#737785;
  --accent:#AE1818; --accent-hover:#8C1313; --accent-ink:#A01A1A; --accent-soft:#FBEDED; --on-accent:#FFFFFF;
  --ok:#1D7A46; --ok-soft:#E6F4EC; --warn:#9A5B00; --warn-soft:#FDF2DF; --crit:#B42318; --crit-soft:#FDECEA; --info:#2F5DA8; --info-soft:#E9EFFA;
  --frame:#15161B; --frame-2:#23252D; --frame-ink:#F2F2F4; --frame-mute:#8B8F9B;
  --c1:#AE1818; --c2:#2F5DA8; --c3:#1D7A46; --c4:#9A5B00; --c5:#6B4FA0; --c6:#127A84;
  --shadow:0 1px 2px rgba(25,27,34,.06),0 4px 16px rgba(25,27,34,.06);
  --shadow-pop:0 12px 40px rgba(25,27,34,.18),0 2px 6px rgba(25,27,34,.08);
  --f-display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"Mulish",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Space Grotesk",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-sm:6px; --r:8px; --r-lg:10px;
  --sb-w:252px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F13; --surface:#16181E; --surface-2:#1C1E25; --surface-3:#252831;
  --border:#262932; --border-strong:#353945;
  --text:#ECEDF1; --text-2:#BFC2CC; --muted:#8E929E;
  --accent:#C42222; --accent-hover:#D73131; --accent-ink:#F2716B; --accent-soft:#2A1517; --on-accent:#FFFFFF;
  --ok:#4CC27E; --ok-soft:#132A1D; --warn:#E8A33D; --warn-soft:#2D2210; --crit:#F2716B; --crit-soft:#2E1615; --info:#7FA6EC; --info-soft:#16213A;
  --frame:#0A0B0E; --frame-2:#1F2129; --frame-ink:#F2F2F4; --frame-mute:#8B8F9B;
  --c1:#E0514B; --c2:#6F9BEA; --c3:#4CC27E; --c4:#E8A33D; --c5:#A88AE0; --c6:#4FC0CA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  --shadow-pop:0 16px 48px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0F13; --surface:#16181E; --surface-2:#1C1E25; --surface-3:#252831;
  --border:#262932; --border-strong:#353945;
  --text:#ECEDF1; --text-2:#BFC2CC; --muted:#8E929E;
  --accent:#C42222; --accent-hover:#D73131; --accent-ink:#F2716B; --accent-soft:#2A1517; --on-accent:#FFFFFF;
  --ok:#4CC27E; --ok-soft:#132A1D; --warn:#E8A33D; --warn-soft:#2D2210; --crit:#F2716B; --crit-soft:#2E1615; --info:#7FA6EC; --info-soft:#16213A;
  --frame:#0A0B0E; --frame-2:#1F2129; --frame-ink:#F2F2F4; --frame-mute:#8B8F9B;
  --c1:#E0514B; --c2:#6F9BEA; --c3:#4CC27E; --c4:#E8A33D; --c5:#A88AE0; --c6:#4FC0CA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  --shadow-pop:0 16px 48px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);height:100%}
.app.collapsed{--sb-w:64px}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px);transition:width .2s ease}
.sb-head{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-bottom:1px solid var(--border);flex:none}
.sb-logo{width:28px;height:28px;flex:none;display:grid;place-items:center}
.sb-logo img{width:26px;height:auto;display:block}
:root[data-theme="dark"] .sb-logo,
.dark-logo-fix .sb-logo{background:#F3F3F5;border-radius:6px}
.sb-brand{min-width:0;line-height:1.15}
.sb-brand b{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.02em;display:block}
.sb-brand span{font-size:11.5px;color:var(--muted)}
.sb-collapse{margin-left:auto;color:var(--muted);width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center}
.sb-collapse:hover{background:var(--surface-2);color:var(--text)}
.sb-search{margin:12px 12px 4px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r);color:var(--muted);background:var(--surface-2);font-size:13px;width:calc(100% - 24px);text-align:left}
.sb-search:hover{border-color:var(--border-strong)}
.sb-search kbd{margin-left:auto}
kbd{font-family:var(--f-data);font-size:11px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 16px;scrollbar-width:thin}
.sb-group{margin-top:14px}
.sb-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px}
.sb-link{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:var(--r-sm);color:var(--text-2);font-size:13.5px;font-weight:500;width:100%;text-align:left;position:relative;white-space:nowrap}
.sb-link:hover{background:var(--surface-2);color:var(--text)}
.sb-link.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.sb-link.active::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.sb-link .badge{margin-left:auto}
.sb-link .tag-soon{margin-left:auto;font-size:10px;color:var(--muted);font-weight:600}
.sb-foot{border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;flex:none}
.sb-foot .who{min-width:0;line-height:1.2}
.sb-foot .who b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot .who span{font-size:11.5px;color:var(--muted)}
.app.collapsed .sb-brand,.app.collapsed .sb-label,.app.collapsed .sb-link span,.app.collapsed .sb-link .badge,.app.collapsed .sb-link .tag-soon,.app.collapsed .sb-search span,.app.collapsed .sb-search kbd,.app.collapsed .sb-foot .who{display:none}
.app.collapsed .sb-head{padding:0;justify-content:center;flex-direction:column;height:auto;padding-block:10px;gap:6px}
.app.collapsed .sb-collapse{margin:0}
.app.collapsed .sb-collapse svg{transform:rotate(180deg)}
.app.collapsed .sb-link{justify-content:center;padding:0}
.app.collapsed .sb-search{justify-content:center;padding:0;width:40px;margin-inline:auto}
.app.collapsed .sb-group{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.app.collapsed .sb-group:first-child{border-top:0}
.app.collapsed .sb-foot{justify-content:center}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 24px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:20}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.preview-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.preview-pill i{width:6px;height:6px;border-radius:50%;background:var(--warn);display:block}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:var(--r);display:grid;place-items:center;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.menu-btn{display:none}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r);font-size:13px;font-weight:700;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;gap:5px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r);padding:2px;background:var(--surface-2);gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:12px;font-weight:700;color:var(--text-2)}
.input,.select{height:36px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);padding:0 11px;width:100%;min-width:0}
.input:focus,.select:focus{outline:none;border-color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-opt{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border-strong);font-size:12.5px;font-weight:600;color:var(--text-2);background:var(--surface)}
.chip-opt:hover{border-color:var(--muted)}
.chip-opt[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface)}

/* ---------- cards & pills ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-h .meta{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.card-b{padding:16px}
.link{color:var(--accent-ink);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.brand{background:var(--accent-soft);color:var(--accent-ink)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge{min-width:20px;height:18px;padding:0 6px;border-radius:999px;font-size:11px;font-weight:700;display:inline-grid;place-items:center;background:var(--surface-3);color:var(--text-2);font-family:var(--f-data)}
.badge.hot{background:var(--accent);color:var(--on-accent)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;font-family:var(--f-ui);letter-spacing:.02em}
.av.lg{width:32px;height:32px;font-size:12px}
.type-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-2);white-space:nowrap}
.type-tag i{width:8px;height:8px;border-radius:2px;display:block}
.plats{display:inline-flex;gap:3px}
.plat{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:800;font-family:var(--f-data);background:var(--surface-3);color:var(--text-2)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 16px;color:var(--muted)}
.empty .ico{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-2)}
.empty b{color:var(--text);font-size:14px}
.empty p{max-width:46ch;font-size:13px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;transition:border-color .12s}
.kpi:hover{border-color:var(--border-strong)}
.kpi .k-l{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.kpi .k-l svg{color:var(--muted)}
.kpi .k-v{font-family:var(--f-data);font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.kpi .k-s{font-size:12px;color:var(--muted)}
.kpi .k-s em{font-style:normal;font-weight:700}
.kpi .k-s em.warn{color:var(--warn)} .kpi .k-s em.crit{color:var(--crit)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pipe-bar{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface-2)}
.pipe-bar span{display:block;min-width:4px}
.pipe-legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px;margin-top:16px}
.pl-item{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:var(--r);text-align:left}
.pl-item:hover{background:var(--surface-2)}
.pl-item .n{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);font-weight:600}
.pl-item .n i{width:8px;height:8px;border-radius:2px;display:block}
.pl-item .v{font-family:var(--f-data);font-size:20px}
.attn{display:flex;flex-direction:column}
.attn-row{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--border);text-align:left;width:100%}
.attn-row:first-child{border-top:0}
.attn-row:hover{background:var(--surface-2)}
.attn-row .stripe{width:3px;align-self:stretch;border-radius:2px;flex:none}
.attn-row .t{font-weight:700;font-size:13.5px}
.attn-row .s{font-size:12px;color:var(--muted)}
.attn-row .r{margin-left:auto;flex:none}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .title-cell{font-weight:700;white-space:normal;min-width:220px}
.due{font-family:var(--f-data);font-size:12.5px}
.due.over{color:var(--crit);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.agenda{display:flex;flex-direction:column}
.ag-day{padding:10px 16px;border-top:1px solid var(--border)}
.ag-day:first-child{border-top:0}
.ag-day .dl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:flex;gap:8px}
.ag-day .dl b{color:var(--accent-ink)}
.ag-item{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.ag-item .tm{font-family:var(--f-data);font-size:12px;color:var(--muted);width:40px;flex:none}
.ag-item .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.feed{display:flex;flex-direction:column}
.feed-row{display:flex;gap:11px;padding:11px 16px;border-top:1px solid var(--border);font-size:13px;align-items:flex-start}
.feed-row:first-child{border-top:0}
.feed-row .body{min-width:0;flex:1}
.feed-row .body p{color:var(--text-2)}
.feed-row .body p b{color:var(--text)}
.feed-row .when{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.agent-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);flex:none}
.plat-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.plat-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;min-width:0}
.plat-row .plat{width:24px;height:24px;font-size:10px}
.plat-row .st{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.note{font-size:12px;color:var(--muted);padding:0 16px 14px}
.perf-empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0}
.perf-empty .ghost-chart{border-left:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:10px}
.ghost-metric{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text-2);padding:8px 10px;border-radius:var(--r);background:var(--surface-2)}
.ghost-metric span:last-child{font-family:var(--f-data);color:var(--muted)}

/* ---------- ideas ---------- */
.ideas-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.gen-panel{position:sticky;top:0}
.gen-panel .card-b{display:flex;flex-direction:column;gap:16px}
.kw{position:relative}
.kw svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.kw .input{padding-left:34px;height:38px;font-weight:600}
.res-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.res-head .sub{font-size:12.5px;color:var(--muted)}
.ideas-list{display:flex;flex-direction:column;gap:10px}
.idea{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);transition:border-color .12s}
.idea:hover{border-color:var(--border-strong)}
.idea.approved{border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
.idea-top{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:14px 16px;align-items:start}
.idea-n{font-family:var(--f-data);font-size:12px;color:var(--muted);padding-top:2px}
.idea-title{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.35}
.idea-hook{color:var(--text-2);font-size:13.5px;margin-top:4px}
.idea-hook::before{content:"Hook  ";font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.idea-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.idea-acts{display:flex;gap:4px;align-items:center}
.idea-detail{border-top:1px solid var(--border);padding:14px 16px 16px 56px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.idea-detail dt{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.idea-detail dd{margin:0;font-size:13px;color:var(--text-2)}
.idea-detail ul{margin:0;padding-left:18px}
.idea-detail .full{grid-column:1/-1}
.idea-foot{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1;padding-top:4px}
.comp-box{background:var(--warn-soft);border-radius:var(--r);padding:10px 12px;color:var(--text)}
.comp-box dd{color:var(--text)}
[contenteditable="true"]{outline:1px dashed var(--accent-ink);outline-offset:3px;border-radius:3px}
.gen-loading{display:flex;flex-direction:column;gap:10px}
.skel{height:92px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- board ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .select{width:auto;height:32px;font-size:12.5px}
.board-wrap{overflow-x:auto;padding-bottom:8px;margin-inline:-4px}
.board{display:flex;gap:10px;padding:0 4px;align-items:flex-start;min-height:420px}
.col{width:268px;flex:none;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;font-weight:700}
.col-h i{width:8px;height:8px;border-radius:2px;display:block}
.col-h .badge{margin-left:auto}
.col-b{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.col.drop .col-b{background:var(--accent-soft);border-radius:var(--r)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.kcard:hover{border-color:var(--border-strong)}
.kcard.dragging{opacity:.4}
.kcard .kt{font-weight:700;font-size:13px;line-height:1.35}
.kcard .kr{display:flex;align-items:center;gap:8px;justify-content:space-between}
.kcard .camp{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prio{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.prio.High{color:var(--crit)}

/* ---------- calendar ---------- */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--border)}
.cal-head h2{font-size:16px;min-width:150px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border)}
.cal-cell{min-height:118px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell.out{background:var(--surface-2)}
.cal-cell.out .dn{color:var(--muted)}
.cal-cell.drop{background:var(--accent-soft)}
.dn{font-family:var(--f-data);font-size:12px;font-weight:500;padding:2px 4px;display:flex;justify-content:space-between;align-items:center}
.cal-cell.today .dn span{background:var(--accent);color:var(--on-accent);border-radius:5px;padding:0 6px}
.ev{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);min-width:0;cursor:grab;text-align:left;width:100%}
.cal-cell.out .ev{background:var(--surface)}
.ev i{width:3px;align-self:stretch;border-radius:2px;flex:none}
.ev span{overflow:hidden;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.ev.pub{opacity:.62}
.cal-list .tbl td{white-space:normal}
.bal{display:flex;flex-direction:column;gap:12px}
.bal-row{display:grid;grid-template-columns:92px minmax(0,1fr) 22px;gap:10px;align-items:center;font-size:12.5px}
.bal-row .bar{height:8px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bal-row .bar span{display:block;height:100%;border-radius:3px}
.bal-row .v{font-family:var(--f-data);text-align:right;color:var(--text-2)}
.hint{display:flex;gap:9px;font-size:12.5px;color:var(--text-2);background:var(--info-soft);border-radius:var(--r);padding:10px 12px}
.hint svg{color:var(--info);margin-top:2px}

/* ---------- styles ---------- */
.styles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.style-card{display:flex;flex-direction:column;text-align:left;overflow:hidden;transition:border-color .12s,transform .12s}
.style-card:hover{border-color:var(--border-strong)}
.thumb{aspect-ratio:16/10;background:var(--frame);position:relative;overflow:hidden;max-width:100%;border-bottom:1px solid var(--border)}
.thumb svg{width:100%;height:100%;display:block}
.thumb .ar{position:absolute;right:8px;bottom:8px;font-family:var(--f-data);font-size:10.5px;color:var(--frame-ink);background:rgba(0,0,0,.45);padding:1px 6px;border-radius:4px}
.sc-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.sc-b p{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.sv-f{fill:var(--frame-ink)} .sv-m{fill:var(--frame-mute)} .sv-a{fill:#C42222} .sv-b{fill:var(--frame-2)} .sv-s{stroke:var(--frame-ink);fill:none} .sv-sa{stroke:#E0514B;fill:none}

/* ---------- drawer / modal / palette ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,11,14,.42);z-index:70;display:flex;opacity:0;transition:opacity .16s}
.scrim.on{opacity:1}
.drawer{margin-left:auto;width:min(620px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;transform:translateX(24px);transition:transform .2s ease;padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scrim.on .drawer{transform:none}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.dr-b{overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px}
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.spec div{background:var(--surface);padding:10px 12px}
.spec dt{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.spec dd{margin:0;font-size:13px}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist label{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.checklist input{accent-color:var(--accent);margin-top:3px}
.dropzone{border:1.5px dashed var(--border-strong);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.dropzone.on{border-color:var(--accent-ink);background:var(--accent-soft)}
.dropzone b{color:var(--text)}
.modal-wrap{margin:auto;width:min(480px,calc(100% - 32px))}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-pop);border:1px solid var(--border);transform:translateY(8px);transition:transform .18s}
.scrim.on .modal{transform:none}
.modal .card-b{display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.palette{margin:12vh auto auto;width:min(600px,calc(100% - 32px));background:var(--surface);border-radius:12px;box-shadow:var(--shadow-pop);border:1px solid var(--border);overflow:hidden;align-self:flex-start}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border)}
.pal-in input{flex:1;height:52px;border:0;background:none;font-size:15px;outline:none}
.pal-list{max-height:min(380px,55vh);overflow-y:auto;padding:6px}
.pal-sec{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-sm);font-size:13.5px;text-align:left;color:var(--text-2)}
.pal-item .grp{margin-left:auto;font-size:11.5px;color:var(--muted)}
.pal-item.sel{background:var(--surface-2);color:var(--text)}
.pop{position:absolute;top:48px;right:0;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);z-index:40;padding:6px}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);font-size:13px;font-weight:600;text-align:left}
.pop-item:hover{background:var(--surface-2)}
.pop-item small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.pop-item .pi{width:30px;height:30px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text-2)}
.notif-pop{width:340px;padding:0}
.notif-pop .feed-row:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--text);color:var(--surface);padding:10px 14px;border-radius:var(--r);font-size:13px;font-weight:600;box-shadow:var(--shadow-pop);opacity:0;transition:opacity .16s,transform .16s;z-index:90;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.placeholder{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.ph-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ph-list li{display:flex;gap:10px;font-size:13.5px;color:var(--text-2)}
.ph-list li svg{color:var(--muted);margin-top:3px}
.risk{font-size:12px;color:var(--muted);line-height:1.55;border-top:1px solid var(--border);padding-top:14px}
.risk b{color:var(--text-2)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal-layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:980px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:280px;z-index:80;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow-pop);padding-top:env(safe-area-inset-top,0px)}
  .app.mob-open .sidebar{transform:none}
  .app.collapsed .sb-brand,.app.collapsed .sb-label,.app.collapsed .sb-link span,.app.collapsed .sb-link .badge,.app.collapsed .sb-search span,.app.collapsed .sb-search kbd,.app.collapsed .sb-foot .who{display:revert}
  .sb-collapse{display:none}
  .menu-btn{display:grid}
  .topbar{padding-left:max(12px,env(safe-area-inset-left,0px));top:env(safe-area-inset-top,0px)}
  .grid-2,.ideas-layout,.placeholder{grid-template-columns:minmax(0,1fr)}
  .gen-panel{position:static}
  .perf-empty{grid-template-columns:minmax(0,1fr)}
  .perf-empty .ghost-chart{border-left:0;border-top:1px solid var(--border)}
}
@media (max-width:640px){
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3{grid-template-columns:minmax(0,1fr)}
  .pipe-legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plat-list{grid-template-columns:minmax(0,1fr)}
  .crumbs .c-sec,.crumbs .c-sep,.preview-pill .long{display:none}
  .idea-detail{grid-template-columns:minmax(0,1fr);padding-left:16px}
  .idea-top{grid-template-columns:minmax(0,1fr)}
  .idea-n{display:none}
  .spec{grid-template-columns:minmax(0,1fr)}
  .cal-cell{min-height:72px;padding:3px}
  .ev span{display:none}
  .ev{padding:3px;justify-content:center;width:auto}
  .cal-cell .evs{display:flex;flex-wrap:wrap;gap:3px}
  .tb-qc span{display:none}
  .page-head .actions{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* overlay helper */
function overlay(html,onReady){
 const s=document.createElement('div');s.className='scrim';s.innerHTML=html;$('#layer').appendChild(s);
 requestAnimationFrame(()=>s.classList.add('on'));
 const close=()=>{s.classList.remove('on');setTimeout(()=>s.remove(),180);document.removeEventListener('keydown',k)};
 const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
 s.addEventListener('mousedown',e=>{if(e.target===s)close()});
 $$('[data-close]',s).forEach(b=>b.onclick=close);
 onReady&&onReady(s,close);return close;
}

/* command palette */
function openPalette(){
 const items=[];NAV.forEach(([g,l])=>l.forEach(([id,label,icon])=>items.push({k:'nav',id,label,icon,g})));
 QC.forEach(([k,t,,i])=>items.push({k:'act',id:k,label:t,icon:i,g:'Create'}));
 ITEMS.slice(0,40).forEach(it=>items.push({k:'item',id:it.id,label:it.t,icon:'kanban',g:it.st}));
 overlay(`<div class="palette" role="dialog" aria-label="Command palette"><div class="pal-in">${ic('search',18)}<input id="palIn" placeholder="Search pages, actions and content…" autocomplete="off" aria-label="Search"><kbd>Esc</kbd></div><div class="pal-list" id="palList"></div></div>`,(s,close)=>{
  const inp=$('#palIn',s),list=$('#palList',s);let sel=0,cur=[];
  const draw=()=>{const q=inp.value.trim().toLowerCase();cur=items.filter(i=>!q||i.label.toLowerCase().includes(q)||i.g.toLowerCase().includes(q)).slice(0,30);sel=Math.min(sel,Math.max(cur.length-1,0));
   if(!cur.length){list.innerHTML=`<div class="empty"><b>No matches</b><p>Try a page name like “calendar” or a content title.</p></div>`;return}
   let last='';list.innerHTML=cur.map((i,n)=>{const sec=i.k==='nav'?'Pages':i.k==='act'?'Create':'Content';const h=sec!==last?`<div class="pal-sec">${sec}</div>`:'';last=sec;
    return h+`<button class="pal-item${n===sel?' sel':''}" data-n="${n}">${ic(i.icon)}<span>${esc(i.label)}</span><span class="grp">${esc(i.g)}</span></button>`}).join('');};
  const run=i=>{close();if(!i)return;if(i.k==='nav')go(i.id);else if(i.k==='act')quickCreate(i.id);else go('board')};
  inp.oninput=()=>{sel=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,cur.length-1);draw();e.preventDefault();$('.pal-item.sel',list)?.scrollIntoView({block:'nearest'})}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault();$('.pal-item.sel',list)?.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){run(cur[sel])}};
  list.onclick=e=>{const b=e.target.closest('.pal-item');if(b)run(cur[+b.dataset.n])};
  draw();setTimeout(()=>inp.focus(),30);
 });
}

 draw();
 $$('[data-sf]').forEach(b=>b.onclick=()=>{styleFilter=b.dataset.sf;$$('[data-sf]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});

function openStyle(s,editNow){
 const F=[['pace','Pacing'],['trans','Transitions'],['ease','Easing'],['type','Typography rules'],['color','Colour treatment'],['cap','Caption style'],['broll','B-roll approach'],['sound','Sound design'],['ar','Aspect ratios'],['cx','Complexity']];
 overlay(`<aside class="drawer" role="dialog" aria-label="${esc(s.name)}">
  <div class="dr-h"><span class="agent-ico">${ic('scissors',14)}</span><h2 data-sf2="name" style="font-size:16px">${esc(s.name)}</h2><div style="margin-left:auto;display:flex;gap:6px"><button class="btn sm" id="stEdit">${ic('edit',14)}Edit</button><button class="btn sm" id="stDup">${ic('copy',14)}Duplicate</button><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div></div>
  <div class="dr-b">
   <div class="thumb" style="border-radius:var(--r);border:1px solid var(--border)">${thumb(s.motif)}<span class="ar">Visual preview</span></div>
   <p data-sf2="desc" style="font-size:14px;color:var(--text-2)">${esc(s.desc)}</p>
   <dl class="spec">${F.map(([k,l])=>`<div><dt>${l}</dt><dd data-sf2="${k}">${esc(s[k])}</dd></div>`).join('')}</dl>
   <section><h3 style="margin-bottom:8px">Reference videos</h3>
    <label class="dropzone" id="dz"><span class="ico">${ic('upload',18)}</span><b>Drop reference videos or images</b><span>The Creative Director agent extracts pacing, type and colour treatment from each upload.</span><input type="file" id="dzIn" multiple accept="video/*,image/*" hidden></label>
    <div id="dzList" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
   </section>
   <section><h3 style="margin-bottom:8px">Production checklist</h3><div class="checklist">${s.check.map((c,n)=>`<label><input type="checkbox" id="ck${s.id}-${n}">${esc(c)}</label>`).join('')}</div></section>
  </div></aside>`,(o,close)=>{
  const dz=$('#dz',o),inp=$('#dzIn',o),lst=$('#dzList',o);
  const add=files=>{[...files].forEach(f=>{lst.insertAdjacentHTML('beforeend',`<div class="plat-row">${ic(f.type.startsWith('video')?'video':'image')}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span><span class="st">Queued for analysis</span></div>`)})};
  inp.onchange=()=>add(inp.files);
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');add(e.dataTransfer.files)};
  const ed=$('#stEdit',o);const els=()=>$$('[data-sf2]',o);
  const toggle=()=>{const on=els()[0].isContentEditable;if(on){els().forEach(el=>{s[el.dataset.sf2]=el.textContent.trim();el.contentEditable='false'});ed.innerHTML=ic('edit',14)+'Edit';toast('Style saved');if(location.hash==='#styles')pageStyles()}else{els().forEach(el=>el.contentEditable='true');els()[0].focus();ed.innerHTML=ic('check',14)+'Save'}};
  ed.onclick=toggle;if(editNow)setTimeout(toggle,50);
  $('#stDup',o).onclick=()=>{const n={...s,id:STYLES.length,name:s.name+' (copy)',custom:true,check:[...s.check]};STYLES.push(n);close();if(location.hash==='#styles')pageStyles();toast('Style duplicated')};
 });
}
